name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are not available to fork PRs; skip drafts to save tokens
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip when ANTHROPIC_API_KEY is not configured
        if: env.HAS_ANTHROPIC_KEY != 'true'
        run: echo "::notice::Add the ANTHROPIC_API_KEY repository secret to enable the AI review."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_ANTHROPIC_KEY == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@4845bacbb38b3c4b15d948f035349786f678e068 # v1.0.267
        if: env.HAS_ANTHROPIC_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The project adds role-based access control
            (admin, manager, member) to a FastAPI + React template. The policy lives in
            backend/app/core/permissions.py and is enforced by require_permission in
            backend/app/api/deps.py; README.md documents the permission matrix.

            Focus, in order:
            1. Authorization: every non-public route requires a permission; no route or
               component compares role names; the frontend gates only via hasPermission;
               no privilege escalation (role only writable by users:create/users:update,
               self-lockout guard intact); 401 vs 403 semantics.
            2. Other security issues (injection, secrets, unsafe defaults, data exposure).
            3. Correctness bugs and missing tests for allowed AND denied paths.
            4. Readability and consistency with the surrounding code.

            Report only concrete, actionable findings, with file and line. Use inline
            comments for specific code issues and one top-level summary comment.
            Do not comment on style that the linters (ruff, biome) already enforce.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
